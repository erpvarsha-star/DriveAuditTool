name: Weekly Drive Audit

on:
  schedule:
    - cron: '0 3 * * 0'   # Every Sunday 08:30 IST (UTC+5:30 = 03:00 UTC)
  workflow_dispatch:        # Manual trigger anytime

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            google-api-python-client \
            gspread

      - name: Restore credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Restore token
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          python - <<'EOF'
          import base64, os, sys
          token = os.environ.get('GOOGLE_TOKEN', '')
          if not token:
              sys.exit("ERROR: GOOGLE_TOKEN secret is missing or empty.")
          try:
              decoded = base64.b64decode(token)
          except Exception as e:
              sys.exit(f"ERROR: GOOGLE_TOKEN is not valid base64: {e}")
          with open('token.pickle', 'wb') as f:
              f.write(decoded)
          print("token.pickle restored successfully.")
          EOF

      - name: Restore previous audit data
        uses: actions/cache@v4
        with:
          path: |
            audit_data.json
            seen_hashes.json
            scanned_folders.json
          key: audit-resume-${{ github.run_number }}
          restore-keys: |
            audit-resume-

      - name: Run Drive Scanner
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python drive_audit.py

      - name: Run Report Writer
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          INVENTORY_SHEET_ID: ${{ secrets.INVENTORY_SHEET_ID }}
        run: python write_report.py

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-data-${{ github.run_number }}
          path: |
            audit_data.json
            seen_hashes.json
            scanned_folders.json
            ERP_Migration_Final_Report.csv
          retention-days: 30

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            --data '{"text": ":x: Drive Audit FAILED — check GitHub Actions for details"}'
