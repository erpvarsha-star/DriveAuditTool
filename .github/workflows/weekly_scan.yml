name: Weekly Drive Audit

on:
  schedule:
    - cron: '0 3 * * 0'   # Every Sunday 08:30 IST (UTC+5:30 = 03:00 UTC)
  workflow_dispatch:        # Manual trigger anytime

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── 2. Python setup ────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ─── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2 \
            google-api-python-client \
            gspread

      # ─── 4. Restore Google credentials ──────────────────────────────────────
      - name: Restore credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      # ─── 5. Restore token.pickle [WARN-2: guard against missing/corrupt secret]
      - name: Restore token
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          python - <<'EOF'
          import base64, os, sys
          token = os.environ.get('GOOGLE_TOKEN', '')
          if not token:
              sys.exit("ERROR: GOOGLE_TOKEN secret is missing or empty. "
                       "Re-generate token.pickle locally and update the secret.")
          try:
              decoded = base64.b64decode(token)
          except Exception as e:
              sys.exit(f"ERROR: GOOGLE_TOKEN is not valid base64: {e}")
          with open('token.pickle', 'wb') as f:
              f.write(decoded)
          print("token.pickle restored successfully.")
          EOF

      # ─── 6. Restore previous audit data for resume [BUG-1 / IMP-1] ─────────
      - name: Restore previous audit data (for resume)
        uses: actions/cache@v4
        with:
          path: |
            audit_data.json
            seen_hashes.json
            scanned_folders.json
          key: audit-resume-${{ github.run_number }}
          restore-keys: |
            audit-resume-

      # ─── 7. Run Drive Scanner ───────────────────────────────────────────────
      - name: Run Drive Scanner
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python drive_audit.py

      # ─── 8. Run Report Writer ───────────────────────────────────────────────
      - name: Run Report Writer
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python write_report.py

      # ─── 9. Save audit data as artifact (downloadable from Actions UI) ──────
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-data-${{ github.run_number }}
          path: |
            audit_data.json
            seen_hashes.json
            scanned_folders.json
            ERP_Migration_Final_Report.csv
          retention-days: 30

      # ─── 10. Notify on failure [WARN-2] ─────────────────────────────────────
      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          python - <<'EOF'
          import os, json, urllib.request
          webhook = os.environ.get('SLACK_WEBHOOK', '')
          if not webhook:
              print("No SLACK_WEBHOOK set — skipping failure notification.")
              exit(0)
          payload = json.dumps({
              "text": (
                  ":x: *Drive Audit FAILED* — check "
                  f"https://github.com/${{{{ github.repository }}}}/actions"
              )
          }).encode()
          req = urllib.request.Request(
              webhook, data=payload,
              headers={'Content-Type': 'application/json'}
          )
          urllib.request.urlopen(req, timeout=10)
          EOF
