name: AI ERP Analyser

on:
  schedule:
    - cron: '0 4 * * 0'      # Runs Sunday 09:30 IST — after weekly scan completes
  workflow_dispatch:           # Manual trigger anytime

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ai-analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 300       # 5 hour limit — stops cleanly before GitHub kills it
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-auth google-auth-oauthlib google-auth-httplib2 \
                      google-api-python-client gspread

      - name: Restore credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Restore token
        env:
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          python - <<'EOF'
          import base64, os, sys
          token = os.environ.get('GOOGLE_TOKEN', '')
          if not token:
              sys.exit("ERROR: GOOGLE_TOKEN secret is missing.")
          with open('token.pickle', 'wb') as f:
              f.write(base64.b64decode(token))
          print("token.pickle restored.")
          EOF

      - name: Restore previous audit + AI data
        uses: actions/cache@v4
        with:
          path: |
            audit_data.json
            seen_hashes.json
            scanned_folders.json
            ai_analysis.json
          key: audit-resume-cache
          restore-keys: audit-resume-cache

      - name: Run AI Analyser
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          INVENTORY_SHEET_ID: ${{ secrets.INVENTORY_SHEET_ID }}
        run: python ai_analyser.py

      - name: Upload AI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-results-${{ github.run_number }}
          path: |
            ai_analysis.json
            AI_ERP_Intelligence_Report.csv
          retention-days: 30

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            --data '{"text": ":x: AI Analyser FAILED — check GitHub Actions"}'
